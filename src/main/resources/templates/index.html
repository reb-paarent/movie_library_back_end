<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/main_style.css}" />
</head>

<body>
    <div class="login_info">
        <p sec:authorize="isAuthenticated()">
            Signed in as <span sec:authentication="name">username</span>
        </p>

        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit">Log out</button>
        </form>
    </div>
    <section class="index">
        <h1>Movie Library</h1>
        <h3></h3>

        <form th:action="@{/login}" method="get">
            <button type="submit">Log in to access your movie list</button>
        </form>

        <p></p>

        <form th:action="@{/signup}" method="get">
            <button type="submit">No account? Sign-up</button>
        </form>
    </section>

</body>

</html>
