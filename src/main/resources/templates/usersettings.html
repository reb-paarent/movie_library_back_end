<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/main_style.css}" />
</head>

<body>
    <div class="login_info">
        <p>
            Signed in as <span sec:authentication="name">username</span>
        </p>

        <form th:action="@{/logout}" method="post">
            <button type="submit">Log out</button>
        </form>
    </div>

    <section class="settings">
        <h1>Settings</h1>

        <p th:if="${passwordSuccess}" th:text="${passwordSuccess}" role="status"></p>
        <p th:if="${passwordError}" th:text="${passwordError}" role="alert"></p>
        <p th:if="${emailSuccess}" th:text="${emailSuccess}" role="status"></p>
        <p th:if="${emailError}" th:text="${emailError}" role="alert"></p>

        <h2>Change email address</h2>
        <p>Current email: <span th:text="${currentEmail}"></span></p>
        <form th:action="@{/usersettings/email}" method="post">
            <div>
                <label for="email">New email address:</label>
                <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required />
            </div>
            <button type="submit">Change email</button>
        </form>

        <h2>Change password</h2>
        <form th:action="@{/usersettings/password}" method="post">
            <div>
                <label for="currentPassword">Current password:</label>
                <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password"
                    required />
            </div>
            <div>
                <label for="newPassword">New password:</label>
                <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12"
                    maxlength="30" required />
            </div>
            <div>
                <label for="confirmPassword">Confirm new password:</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
                    minlength="12" maxlength="30" required />
            </div>
            <button type="submit">Change password</button>
        </form>
    </section>

    <nav>
        <form th:action="@{/userhomepage}" method="get">
            <button type="submit" class="btn btn-primary">Return to Home</button>
        </form>
    </nav>

</body>

</html>
