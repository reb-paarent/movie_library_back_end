<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Log in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/main_style.css}" />
</head>

<body>
    <section class="login">
        <h1>Log in</h1>
        <div>
            <div class="alert alert-danger" th:if="${param.error}">
                Invalid username and password.
            </div>
            <div class="alert alert-warning" th:if="${param.logout}">
                You have been logged out.
            </div>
            <form th:action="@{/login}" method="post">
                <div><label> User Name : <input type="text" name="username" class="form-control" /> </label></div>
                <div><label> Password: <input type="password" name="password" class="form-control" /> </label></div>
                <div><input type="submit" value="Sign in" class="btn btn-primary" /></div>
            </form>
    </section>

    <nav>
        <form th:action="@{/signup}" method="get">
            <button type="submit">Sign up</button>
        </form>
        <form th:action="@{/index}" method="get">
            <button type="submit">Return</button>
        </form>
    </nav>

    <!--
        Password resets don't function yet. Commented out.
        
        <a th:href="@{/reset}">Forgot your password?</a>
        -->

    </div>
</body>

</html>
