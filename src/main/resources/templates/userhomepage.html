<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <p>
        Signed in as <span sec:authentication="name">username</span>
    </p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Log out</button>
    </form>

    <h1>Homepage</h1>

    <a href="/usersettings" class="btn btn-primary">Settings</a>

    <a href="/wanttowatch" class="btn btn-primary">Want to Watch</a>

    <a href="/movielist" class="btn btn-primary">See All Movies</a>


    <h2>Watch By Genre</h2>

    <select aria-label="Select a genre"
            onchange="if (this.value) window.location.href = this.value">
        <option value="" selected disabled>Choose a genre</option>
        <option value="/action">Action</option>
        <option value="/adventure">Adventure</option>
        <option value="/comedy">Comedy</option>
        <option value="/drama">Drama</option>
        <option value="/horror">Horror</option>
        <option value="/kids">Kids</option>
        <option value="/scifi">Science Fiction</option>
        <option value="/thriller">Thriller</option>
        <option value="/other">Other</option>
    </select>

</body>

</html>
