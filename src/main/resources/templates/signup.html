<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/main_style.css}" />
</head>

<body>
    <section class="signup">
        <h1>Sign Up</h1>
        <div>
            <form th:object="${signupform}" th:action="@{/saveuser}" action="#" method="post">
                <div>
                    <label> Username :<input type="text" th:field="*{username}" class="form-control" /></label>
                    <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username Error</p>
                </div>
                <div>
                    <label> Email :<input type="email" th:field="*{email}" class="form-control" /></label>
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email Error</p>
                </div>
                <div>
                    <label> Password :<input type="password" th:field="*{password}" class="form-control" /></label>
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password Error</p>
                </div>
                <div>
                    <label> Re-type Password: <input type="password" th:field="*{passwordCheck}"
                            class="form-control" /></label>
                    <p th:if="${#fields.hasErrors('passwordCheck')}" th:errors="*{passwordCheck}">Password Match Error
                    </p>
                </div>

                <input type="submit" class="btn btn-primary" value="Signup"></input>
            </form>
        </div>
    </section>

    <nav>
        <form th:action="@{/login}" method="get">
            <button type="submit">Return</button>
        </form>
    </nav>
</body>

</html>
