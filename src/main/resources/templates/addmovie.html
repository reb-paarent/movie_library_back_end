<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/main_style.css}" />
</head>

<section class="change_movie">

    <body>
        <h1>Add Movie</h1>
        <div>
            <form th:object="${movie}" th:action="@{/save}" method="post">
                <label>Title</label>
                <input type="text" id="title" th:field="*{title}" required class="form-control"></input>

                <label>Year</label>
                <input type="text" id="releaseYear" th:field="*{releaseYear}" required class="form-control"></input>

                <label>Director</label>
                <input type="text" id="director" th:field="*{director}" class="form-control"></input>

                <label for="genrelist">Genre</label>
                <select id="genrelist" th:field="*{genre}" class="form-control">
                    <option th:each="genre: ${genres}" th:value="${genre.id}" th:text="${genre.name}"></option>
                </select>

                <label for="statuslist">Watch Status</label>
                <select id="statuslist" th:field="*{watchStatus}" class="form-control">
                    <option th:each="watchStatus: ${watchStatuses}" th:value="${watchStatus.id}"
                        th:text="${watchStatus.name}"></option>
                </select>

                <input type="submit" class="btn btn-success" value="Save"></input>
            </form>
        </div>
</section>

<nav>
    <form th:action="@{/movielist}" method="get">
        <button type="submit" class="btn btn-primary">Cancel</button>
    </form>
</nav>

</body>

</html>
