<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>Add Movie</h1>
    <div>
        <form th:object="${movie}" th:action="@{/save}" method="post">
            <label>Title</label>
            <input type="text" id="title" th:field="*{title}" class="form-control"></input>

            <label>Year</label>
            <input type="text" id="releaseYear" th:field="*{releaseYear}" class="form-control"></input>

            <label>Director</label>
            <input type="text" id="director" th:field="*{director}" class="form-control"></input>

            <label for="deplist">Watch Status</label>
            <select id="deplist" th:field="*{watchStatus}" class="form-control">
                <option th:each="watchStatus: ${watchStatuses}" th:value="${watchStatus.id}"
                    th:text="${watchStatus.name}"></option>
            </select>

            <input type="submit" class="btn btn-success" value="Save"></input>
        </form>
    </div>

    <a href="/movielist" class="btn btn-primary">Cancel</a>
</body>

</html>
