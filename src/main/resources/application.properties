spring.application.name=movies
spring.data.rest.basePath=/api
spring.jpa.show-sql=true

spring.h2.console.enabled=true


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/rebeccap?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=rebeccap
spring.datasource.password=password
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create

server.port=7077
spring.data.rest.base-path=/api


server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat
server.ssl.key-store=${SERVER_SSL_KEY_STORE:/etc/ssl/private/springboot-example.p12}
server.ssl.key-store-password=changeit